name: Discover stocks

on:
  workflow_dispatch:
    inputs:
      kr_count:
        description: "국내주식 발굴 종목수량"
        default: "1"
        type: string
      us_count:
        description: "해외주식 발굴 종목수량"
        default: "1"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python discover.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MY_STOCKFINDER }}
          DISCOVER_KR_COUNT: ${{ github.event.inputs.kr_count }}
          DISCOVER_US_COUNT: ${{ github.event.inputs.us_count }}

      - name: Commit candidates/report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates.json candidates.js discover_progress.json reports/
          git diff --cached --quiet || git commit -m "chore: run stock discovery"
          git pull --rebase origin main
          git push

  deploy-pages:
    needs: discover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
