<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데일리 주식 종목 파인더</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="candidates.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<div id="root"></div>

<script type="text/babel">
const { useMemo, useState } = React;

const DATA = window.CANDIDATES_DATA || { generated_at: "데이터 없음 (discover.py 먼저 실행)", candidates: [] };
// REJECT(버핏 기준 미달)는 검색 대상에서 아예 제외 — 후보 목록·달력 집계·필터 전부 이 배열만 사용
const SEARCHABLE_CANDIDATES = DATA.candidates.filter(c => c.warren_score?.verdict !== "REJECT");
const TAG_OPTIONS = ["고배당주", "성장주"];
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

function formatPrice(market, price) {
  if (price == null) return "—";
  return market === "kr"
    ? "₩" + Math.round(price).toLocaleString("ko-KR")
    : "$" + price.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function SummaryBar() {
  const today = new Date().toLocaleDateString("ko-KR", {
    year: "numeric", month: "long", day: "numeric", weekday: "long",
  });
  const buyCount = SEARCHABLE_CANDIDATES.filter(c => c.opinion === "매수").length;
  const tagCounts = TAG_OPTIONS.map(t => ({
    tag: t, count: SEARCHABLE_CANDIDATES.filter(c => (c.tags || []).includes(t)).length,
  })).filter(t => t.count > 0);
  const tip = tagCounts.length
    ? `오늘 매수 후보 ${buyCount}종목 · ` + tagCounts.map(t => `${t.tag} ${t.count}개`).join(" · ")
    : `오늘 매수 후보 ${buyCount}종목`;

  return (
    <div className="bg-slate-900 text-white px-6 py-4">
      <div className="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
        <div>
          <h1 className="text-lg font-bold">데일리 주식 종목 파인더</h1>
          <p className="text-xs text-slate-400">{today}</p>
        </div>
        <div className="text-sm text-slate-300">
          <div>업데이트: {DATA.generated_at}</div>
          <div className="text-blue-300">{tip}</div>
        </div>
      </div>
    </div>
  );
}

function FilterBar({ market, setMarket, opinion, setOpinion, tags, toggleTag, search, setSearch }) {
  const segBtn = (active) =>
    "px-3 py-1.5 rounded-md text-sm font-medium " +
    (active ? "bg-blue-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50");

  return (
    <div className="max-w-6xl mx-auto px-6 py-4 flex flex-wrap items-center gap-3">
      <div className="flex gap-1 bg-slate-200 rounded-md p-1">
        {[["all", "전체"], ["kr", "국내"], ["us", "해외"]].map(([v, l]) => (
          <button key={v} className={segBtn(market === v)} onClick={() => setMarket(v)}>{l}</button>
        ))}
      </div>
      <div className="flex gap-1 bg-slate-200 rounded-md p-1">
        {[["all", "전체"], ["매수", "매수"], ["매도", "매도"], ["보유", "보유"]].map(([v, l]) => (
          <button key={v} className={segBtn(opinion === v)} onClick={() => setOpinion(v)}>{l}</button>
        ))}
      </div>
      <div className="flex gap-2">
        {TAG_OPTIONS.map(t => (
          <button
            key={t}
            onClick={() => toggleTag(t)}
            className={
              "px-3 py-1.5 rounded-full text-sm border " +
              (tags.has(t)
                ? "bg-blue-600 border-blue-600 text-white"
                : "bg-white border-slate-300 text-slate-600 hover:border-blue-400")
            }
          >
            {t}
          </button>
        ))}
      </div>
      <input
        value={search}
        onChange={e => setSearch(e.target.value)}
        placeholder="종목명 또는 티커 검색"
        className="ml-auto px-3 py-1.5 rounded-md border border-slate-300 text-sm w-56 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
  );
}

// 현재가 대비 고정 비율 매수/손절/목표 — 실제 매매 조언이 아닌 참고용 기준선(index.html과 동일 공식)
function priceLevels(price) {
  const round2 = (v) => Math.round(v * 100) / 100;
  return {
    buyLow: round2(price * 0.98),
    buyHigh: round2(price),
    stopLoss: round2(price * 0.92),
    target: round2(price * 1.15),
  };
}

function verdictBadge(c) {
  const ws = c.warren_score;
  const verdict = ws?.verdict;
  if (verdict === "WAIT") return { style: "bg-amber-500 text-white", text: "관망" };
  if (verdict === "REJECT") return { style: "bg-slate-400 text-white", text: "제외" };
  if (c.opinion === "매도") return { style: "bg-blue-600 text-white", text: "매도" };
  if (c.opinion === "보유") return { style: "bg-slate-400 text-white", text: "보유" };
  // PASS 또는 버핏 검토 없이 기술적으로만 매수인 경우
  const hint = ws && ws.timing != null && ws.timing < 6 ? " (분할매수)" : "";
  return { style: "bg-emerald-600 text-white", text: "매수" + hint };
}

function gradeLabel(score) {
  if (score == null) return "—";
  if (score >= 7) return "우수";
  if (score >= 5) return "양호";
  if (score >= 3) return "보통";
  return "미흡";
}

function techGradeLabel(score, rsi) {
  if (score == null) return "—";
  let label = score >= 7 ? "강세" : score >= 5 ? "중립" : "약세";
  if (rsi != null) {
    if (rsi >= 70) label += "(과열)";
    else if (rsi <= 35) label += "(저점)";
  }
  return label;
}

function CandidateCard({ c, rank, onAnalyze }) {
  const ws = c.warren_score;
  const badge = verdictBadge(c);
  const summary = c.buffett_review?.stage4?.summary || c.buffett_review?.stage3_conclusion || c.comment;
  const financeDetail = c.buffett_review?.checklist?.moat || c.buffett_review?.valuation || "";
  const lv = priceLevels(c.price);

  return (
    <div className="bg-white rounded-lg shadow-sm border border-slate-200 p-4 flex flex-col gap-3">
      <div className="flex items-start justify-between gap-2">
        <div>
          <div className="font-bold text-slate-800">
            {rank}. {c.name} <span className="text-slate-400 font-normal">({c.ticker})</span>
          </div>
          <div className="text-xs text-slate-400">
            {c.market === "kr" ? "국내" : "해외"} · {formatPrice(c.market, c.price)}
            {ws && ws.total != null && <> · 총점 {ws.total.toFixed(1)}</>}
          </div>
        </div>
        <span className={"shrink-0 px-2.5 py-1 rounded-full text-xs font-bold " + badge.style}>{badge.text}</span>
      </div>

      <p className="text-sm text-slate-600 leading-snug">{summary}</p>

      <div className="grid grid-cols-2 gap-3 border-t border-slate-100 pt-2 text-xs">
        <div>
          <div className="font-bold text-slate-700 mb-0.5">
            재무 평가 <span className="text-slate-400 font-normal">[{gradeLabel(ws?.financial)}]</span>
          </div>
          <div className="text-slate-500 leading-snug">{financeDetail}</div>
        </div>
        <div>
          <div className="font-bold text-slate-700 mb-0.5">
            기술 평가 <span className="text-slate-400 font-normal">[{techGradeLabel(ws?.technical, ws?.rsi)}]</span>
          </div>
          <div className="text-slate-500 leading-snug">{c.comment}</div>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-2 border-t border-slate-100 pt-2 text-xs text-center">
        <div>
          <div className="text-slate-400 mb-0.5">매수</div>
          <div className="font-semibold text-slate-700">
            {formatPrice(c.market, lv.buyLow)} ~ {formatPrice(c.market, lv.buyHigh)}
          </div>
        </div>
        <div>
          <div className="text-slate-400 mb-0.5">손절</div>
          <div className="font-semibold text-slate-700">{formatPrice(c.market, lv.stopLoss)}</div>
        </div>
        <div>
          <div className="text-slate-400 mb-0.5">목표</div>
          <div className="font-semibold text-slate-700">{formatPrice(c.market, lv.target)}</div>
        </div>
      </div>

      <button
        onClick={() => onAnalyze(c)}
        className="mt-1 w-full py-1.5 rounded-md bg-slate-800 text-white text-sm font-medium hover:bg-slate-700"
      >
        AI 분석 보기
      </button>
    </div>
  );
}

function AnalysisPanel({ candidate, onClose }) {
  if (!candidate) return null;
  const review = candidate.buffett_review;

  return (
    <div className="fixed inset-0 z-50 flex justify-end">
      <div className="absolute inset-0 bg-black/40" onClick={onClose}></div>
      <div className="relative bg-white w-full sm:w-[420px] h-full overflow-y-auto shadow-xl p-5">
        <div className="flex items-start justify-between mb-4">
          <div>
            <div className="font-bold text-lg">{candidate.name}</div>
            <div className="text-xs text-slate-400">{candidate.ticker}</div>
          </div>
          <button onClick={onClose} className="px-2 py-1 rounded bg-slate-100 text-slate-500 hover:bg-slate-200">닫기</button>
        </div>

        {!review ? (
          <p className="text-sm text-slate-400">아직 AI 분석이 준비되지 않았습니다.</p>
        ) : (
          <div className="space-y-5 text-sm">
            <div className="bg-blue-50 text-blue-700 rounded-md p-3 font-medium">
              {review.stage3_conclusion}
            </div>

            <div>
              <div className="font-bold text-slate-700 mb-2">투자 포인트 3가지</div>
              <ul className="space-y-1.5">
                {(review.stage4?.buy_reasons || []).map((r, i) => (
                  <li key={i} className="flex gap-2">
                    <span className="text-blue-600 font-bold">{i + 1}</span>
                    <span>{r}</span>
                  </li>
                ))}
              </ul>
            </div>

            {review.stage4?.risk_reasons && (
              <div>
                <div className="font-bold text-slate-700 mb-2">리스크 요인</div>
                <ul className="space-y-1.5 text-slate-600">
                  {review.stage4.risk_reasons.map((r, i) => <li key={i}>· {r}</li>)}
                </ul>
              </div>
            )}

            {review.valuation && (
              <div>
                <div className="font-bold text-slate-700 mb-1">밸류에이션</div>
                <p className="text-slate-600">{review.valuation}</p>
              </div>
            )}

            {review.stage4?.beginner_advice && (
              <div>
                <div className="font-bold text-slate-700 mb-1">초보자 조언</div>
                <p className="text-slate-600">{review.stage4.beginner_advice}</p>
              </div>
            )}

            {review.stage4?.summary && (
              <div className="border-t border-slate-100 pt-3 text-slate-500 italic">
                {review.stage4.summary}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function Calendar({ onSelectDay }) {
  const dateStr = DATA.generated_at.split(" ")[0];
  const parsed = /^\d{4}-\d{2}-\d{2}$/.test(dateStr) ? dateStr.split("-").map(Number) : null;
  const now = new Date();
  const [year, setYear] = useState(parsed ? parsed[0] : now.getFullYear());
  const [month, setMonth] = useState(parsed ? parsed[1] - 1 : now.getMonth());

  const prevMonth = () => {
    if (month === 0) { setMonth(11); setYear(y => y - 1); } else setMonth(m => m - 1);
  };
  const nextMonth = () => {
    if (month === 11) { setMonth(0); setYear(y => y + 1); } else setMonth(m => m + 1);
  };

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = Array(firstDow).fill(null).concat(
    Array.from({ length: daysInMonth }, (_, i) => i + 1)
  );
  const isDataDay = (d) => parsed && parsed[0] === year && parsed[1] - 1 === month && parsed[2] === d;

  return (
    <div className="max-w-6xl mx-auto px-6 py-6">
      <div className="flex items-center gap-3 mb-3">
        <button onClick={prevMonth} className="px-2.5 py-1 rounded bg-slate-800 text-white">‹</button>
        <span className="font-bold text-slate-700">{year}년 {month + 1}월</span>
        <button onClick={nextMonth} className="px-2.5 py-1 rounded bg-slate-800 text-white">›</button>
      </div>
      <div className="grid grid-cols-7 gap-px bg-slate-200 border border-slate-200 rounded-md overflow-hidden">
        {WEEKDAYS.map(w => (
          <div key={w} className="bg-slate-50 text-center text-xs text-slate-400 py-2">{w}</div>
        ))}
        {cells.map((d, i) => (
          <div
            key={i}
            onClick={() => d && isDataDay(d) && onSelectDay()}
            className={
              "min-h-[90px] p-2 text-xs " +
              (d ? "bg-white" : "bg-slate-50") +
              (d && isDataDay(d) ? " cursor-pointer hover:bg-blue-50" : "")
            }
          >
            {d && <div className="font-bold text-slate-500 mb-1">{d}</div>}
            {d && isDataDay(d) && (
              <div className="text-blue-600 font-medium">
                매수의견 {SEARCHABLE_CANDIDATES.filter(c => c.warren_score?.verdict === "PASS").length}건,관망 {SEARCHABLE_CANDIDATES.filter(c => c.warren_score?.verdict === "WAIT").length}건
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [modalOpen, setModalOpen] = useState(false);
  const [market, setMarket] = useState("all");
  const [opinion, setOpinion] = useState("all");
  const [tags, setTags] = useState(new Set());
  const [search, setSearch] = useState("");
  const [selected, setSelected] = useState(null);

  const toggleTag = (t) => {
    setTags(prev => {
      const next = new Set(prev);
      next.has(t) ? next.delete(t) : next.add(t);
      return next;
    });
  };

  const filtered = useMemo(() => {
    return SEARCHABLE_CANDIDATES
      .filter(c => {
        if (market !== "all" && c.market !== market) return false;
        if (opinion !== "all" && c.opinion !== opinion) return false;
        if (tags.size > 0 && !(c.tags || []).some(t => tags.has(t))) return false;
        if (search && !(c.name.includes(search) || c.ticker.includes(search))) return false;
        return true;
      })
      .sort((a, b) => (b.warren_score?.total ?? -1) - (a.warren_score?.total ?? -1));
  }, [market, opinion, tags, search]);

  return (
    <div>
      <SummaryBar />
      <Calendar onSelectDay={() => setModalOpen(true)} />
      {modalOpen && (
        <div
          className="fixed inset-0 z-40 flex items-center justify-center bg-black/40 p-4"
          onClick={() => setModalOpen(false)}
        >
          <div
            className="bg-white rounded-lg shadow-xl w-full max-w-6xl max-h-[85vh] overflow-y-auto p-5"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex justify-between items-center mb-3">
              <div className="font-bold text-lg text-slate-800">{DATA.generated_at.split(" ")[0]} 매수 후보</div>
              <button
                onClick={() => setModalOpen(false)}
                className="px-3 py-1 rounded bg-slate-100 text-slate-500 hover:bg-slate-200"
              >
                닫기
              </button>
            </div>
            <FilterBar
              market={market} setMarket={setMarket}
              opinion={opinion} setOpinion={setOpinion}
              tags={tags} toggleTag={toggleTag}
              search={search} setSearch={setSearch}
            />
            {filtered.length === 0 ? (
              <p className="text-center text-slate-400 py-16">조건에 맞는 종목이 없습니다.</p>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {filtered.map((c, i) => (
                  <CandidateCard key={c.market + c.ticker} c={c} rank={i + 1} onAnalyze={setSelected} />
                ))}
              </div>
            )}
          </div>
        </div>
      )}
      <AnalysisPanel candidate={selected} onClose={() => setSelected(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
