<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>주식 트래커</title>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --border: #e2e8f0;
    --border-soft: #eef1f6;
    --text: #1e293b;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: #eef2ff;
    --buy: #dc2626;
    --buy-soft: #fee2e2;
    --sell: #2563eb;
    --sell-soft: #dbeafe;
    --hold: #64748b;
    --hold-soft: #f1f5f9;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 16px -4px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 20px 40px -12px rgba(15, 23, 42, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    padding: 28px;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .updated-at { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
  .updated-at button#updateBtn {
    padding: 6px 14px; border: none; border-radius: var(--radius-sm);
    background: var(--primary); color: #fff; font-weight: 600; font-size: 13px;
    cursor: pointer; box-shadow: var(--shadow-sm); transition: background 0.15s ease, transform 0.1s ease;
  }
  .updated-at button#updateBtn:hover { background: var(--primary-hover); }
  .updated-at button#updateBtn:active { transform: scale(0.97); }
  .updated-at button#updateBtn:disabled { opacity: 0.6; cursor: default; }
  .tabs { display: flex; gap: 4px; margin-bottom: 0; position: relative; z-index: 1; }
  .tab-btn {
    padding: 10px 18px; border: none; background: transparent; color: var(--text-muted);
    cursor: pointer; border-radius: var(--radius-md) var(--radius-md) 0 0; font-size: 14px; font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tab-btn:hover { background: rgba(255,255,255,0.6); color: var(--text); }
  .tab-btn.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
  .tab-panel {
    display: none; background: var(--surface); padding: 22px;
    border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg);
    box-shadow: var(--shadow-md); border: 1px solid var(--border-soft);
  }
  .tab-panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { background: transparent; color: var(--text-faint); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:hover { background: var(--bg); }
  .opinion { font-weight: 700; padding: 3px 10px; border-radius: 999px; font-size: 12px; display: inline-block; white-space: nowrap; cursor: pointer; transition: transform 0.1s ease; }
  .opinion:hover { transform: scale(1.05); box-shadow: var(--shadow-sm); }
  #holdingsTable td, #holdingsTable th { white-space: nowrap; }
  #holdingsTable td:nth-child(2), #holdingsTable td:nth-child(12), #holdingsTable td.no-data { white-space: normal; }
  .opinion-buy { background: var(--buy-soft); color: var(--buy); }
  .opinion-sell { background: var(--sell-soft); color: var(--sell); }
  .opinion-hold { background: var(--hold-soft); color: var(--hold); }
  .pnl-plus { color: var(--buy); font-weight: 600; }
  .pnl-minus { color: var(--sell); font-weight: 600; }
  .no-data { color: var(--text-faint); font-style: italic; }
  .cal-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .cal-header button {
    width: 30px; height: 30px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 999px; cursor: pointer; font-size: 14px; line-height: 1; transition: background 0.15s ease, border-color 0.15s ease;
  }
  .cal-header button:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .cal-header span { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
    background: var(--border-soft); border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: hidden;
  }
  .cal-weekday { background: var(--surface); color: var(--text-faint); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; text-align: center; padding: 10px 0; }
  .cal-cell { background: var(--surface); min-height: 92px; padding: 8px; font-size: 12px; transition: background 0.15s ease, box-shadow 0.15s ease; position: relative; }
  .cal-cell.empty { background: var(--bg); }
  .cal-cell.has-data { cursor: pointer; background: var(--primary-soft); }
  .cal-cell.has-data:hover { background: #e0e7ff; box-shadow: inset 0 0 0 1.5px var(--primary); z-index: 2; }
  .cal-cell .cal-date {
    font-weight: 700; color: var(--text-muted); margin-bottom: 6px;
    display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 999px;
  }
  .cal-cell.today .cal-date { background: var(--primary); color: #fff; }
  .cal-cell.has-data:not(.today) .cal-date { color: var(--primary); }
  .cal-cell .cal-item {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--primary); font-weight: 600; font-size: 11px;
  }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
  .modal-overlay.active { display: flex; }
  .modal-box { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; max-width: 95vw; max-height: 85vh; overflow: auto; box-shadow: var(--shadow-lg); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 20px; }
  .modal-header span { font-weight: 700; font-size: 16px; }
  .modal-header button {
    border: none; background: var(--hold-soft); color: var(--text-muted); border-radius: var(--radius-sm);
    cursor: pointer; padding: 6px 12px; font-size: 13px; font-weight: 600; transition: background 0.15s ease;
  }
  .modal-header button:hover { background: var(--border); color: var(--text); }
  .add-form { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
  .add-form input, .add-form select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; background: var(--surface); color: var(--text);
  }
  .add-form input:focus, .add-form select:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
  .add-form button {
    padding: 8px 16px; border: none; background: var(--primary); color: #fff; font-weight: 600;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; transition: background 0.15s ease;
  }
  .add-form button:hover { background: var(--primary-hover); }
  .del-btn, .edit-btn {
    padding: 5px 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; font-weight: 600; margin-left: 4px; transition: all 0.15s ease;
  }
  .del-btn:hover { background: var(--buy-soft); color: var(--buy); border-color: var(--buy-soft); }
  .edit-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-soft); }
  .empty-msg { color: var(--text-faint); padding: 32px 0; text-align: center; font-size: 13px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; align-items: stretch; }
  .stock-card {
    height: 100%; box-sizing: border-box;
    background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-lg);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow-sm); transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .stock-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .stock-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .stock-card-title { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  .stock-card-title .ticker { color: var(--text-faint); font-weight: 500; font-size: 12px; }
  .stock-card-sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .stock-card-badge { flex-shrink: 0; padding: 4px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.01em; }
  .stock-card-badge.opinion-buy { background: var(--buy); }
  .stock-card-badge.opinion-sell { background: var(--sell); }
  .stock-card-badge.opinion-hold { background: var(--hold); }
  .stock-card-summary { font-size: 13px; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--border-soft); padding-top: 10px; }
  .stock-card-detail-title { font-weight: 700; font-size: 11px; color: var(--text); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.03em; }
  .stock-card-detail-body { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .stock-card-levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid var(--border-soft); padding-top: 10px; text-align: center; font-size: 12px; }
  .stock-card-levels .label { color: var(--text-faint); margin-bottom: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .stock-card-levels .value { font-weight: 700; color: var(--text); }
  .stock-card-cols { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; border-top: 1px solid var(--border-soft); padding-top: 10px; }
  .stock-card-badge.verdict-pass { background: var(--buy); }
  .stock-card-badge.verdict-wait { background: var(--warn); }
  .stock-card-badge.verdict-reject { background: var(--hold); }
  .stock-card-link { font-size: 12px; color: var(--primary); text-decoration: none; font-weight: 600; }
  .stock-card-link:hover { text-decoration: underline; }
  .stock-card-add-btn {
    padding: 7px 0; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s ease;
  }
  .stock-card-add-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-soft); }
  .finder-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .finder-filters .seg { display: flex; gap: 2px; background: var(--bg); border-radius: var(--radius-sm); padding: 2px; }
  .finder-filters .seg button { padding: 6px 12px; border: none; background: transparent; color: var(--text-muted); border-radius: calc(var(--radius-sm) - 2px); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s ease; }
  .finder-filters .seg button.active { background: var(--surface); color: var(--primary); box-shadow: var(--shadow-sm); }
  .finder-filters .tag-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s ease; }
  .finder-filters .tag-btn:hover { border-color: var(--primary); color: var(--primary); }
  .finder-filters .tag-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .finder-filters input[type="text"] {
    margin-left: auto; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; background: var(--surface); color: var(--text);
  }
  .finder-filters input[type="text"]:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
  .buffett-section { margin-bottom: 16px; }
  .buffett-section-title { font-weight: 700; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); }
  .buffett-conclusion { background: var(--primary-soft); color: var(--primary-hover); padding: 12px 14px; border-radius: var(--radius-md); font-weight: 700; margin-bottom: 16px; font-size: 14px; }
  .buffett-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .buffett-list li { margin-bottom: 5px; }

  .summary-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .summary-card {
    background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-lg);
    padding: 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 6px;
  }
  .summary-card-label { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .summary-card-value { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
  .summary-card-value.pnl-plus { color: var(--buy); }
  .summary-card-value.pnl-minus { color: var(--sell); }
  .summary-card-cash-input {
    font-size: 20px; font-weight: 700; color: var(--text); border: none; border-bottom: 1.5px dashed var(--border);
    padding: 0 0 2px; width: 100%; background: transparent; font-family: inherit;
  }
  .summary-card-cash-input:focus { outline: none; border-bottom-color: var(--primary); }
  .chart-box { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 20px; }
  .chart-box-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 8px; }
  .chart-empty { color: var(--text-faint); font-size: 13px; padding: 24px 0; text-align: center; }

  @media (max-width: 640px) {
    .summary-cards { grid-template-columns: repeat(2, 1fr); }
    body { padding: 14px; }
    .tab-panel { padding: 14px; }
    .add-form { flex-direction: column; align-items: stretch; }
    .add-form input, .add-form select, .add-form button { width: 100%; }
    .cal-cell { min-height: 64px; padding: 5px; font-size: 11px; }
    .card-grid { grid-template-columns: 1fr; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    .finder-filters input[type="text"] { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
  <h1>주식 트래커</h1>
  <div class="updated-at">
    <span id="updatedAt"></span>
    <button id="updateBtn">업데이트</button>
    <span id="updateStatus"></span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="finder">종목 파인더</button>
    <button class="tab-btn" data-tab="holdings">보유종목</button>
  </div>

  <div class="tab-panel active" id="panel-finder">
    <div class="cal-header">
      <button id="finderCalPrevBtn">‹</button>
      <span id="finderCalMonthLabel"></span>
      <button id="finderCalNextBtn">›</button>
    </div>
    <div class="cal-grid" id="finderCalGrid"></div>
  </div>

  <div class="tab-panel" id="panel-holdings">
    <div class="summary-cards" id="portfolioSummary"></div>
    <div class="chart-box" id="portfolioChart"></div>
    <div class="add-form">
      <input type="text" id="hTicker" list="tickerSuggestions" placeholder="티커 또는 종목명 (예: 005930, 삼성전자, AAPL)" />
      <datalist id="tickerSuggestions"></datalist>
      <select id="hMarket">
        <option value="kr">국내</option>
        <option value="us">해외</option>
      </select>
      <input type="number" id="hBuyPrice" placeholder="매입가 (원)" step="0.01" />
      <input type="number" id="hQuantity" placeholder="수량" step="1" />
      <button id="hAddBtn">추가</button>
      <button id="hCancelBtn" style="display:none">취소</button>
    </div>
    <table id="holdingsTable">
      <thead>
        <tr>
          <th>티커</th><th>종목명</th><th>매입가</th><th>수량</th><th>현재가</th>
          <th>평가손익</th><th>손익률</th><th>의견</th><th>매수추천가</th><th>손절가</th><th>목표가</th><th>코멘트</th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="buffettModal">
    <div class="modal-box" style="width:480px">
      <div class="modal-header">
        <span id="buffettModalTitle"></span>
        <button id="buffettModalCloseBtn">닫기</button>
      </div>
      <div id="buffettModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="opinionModal">
    <div class="modal-box" style="width:460px">
      <div class="modal-header">
        <span id="opinionModalTitle"></span>
        <button id="opinionModalCloseBtn">닫기</button>
      </div>
      <div id="opinionModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="finderModal">
    <div class="modal-box">
      <div class="modal-header">
        <span id="finderModalDate"></span>
        <button id="finderModalCloseBtn">닫기</button>
      </div>
      <div class="finder-filters">
        <div class="seg" id="finderMarketSeg">
          <button data-value="all" class="active">전체</button>
          <button data-value="kr">국내</button>
          <button data-value="us">해외</button>
        </div>
        <div class="seg" id="finderOpinionSeg">
          <button data-value="all" class="active">전체</button>
          <button data-value="매수">매수</button>
          <button data-value="매도">매도</button>
          <button data-value="보유">보유</button>
        </div>
        <button class="tag-btn" data-tag="고배당주">고배당주</button>
        <button class="tag-btn" data-tag="성장주">성장주</button>
        <input type="text" id="finderSearch" placeholder="종목명 또는 티커 검색" />
      </div>
      <div class="card-grid" id="finderCards"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="candidates.js"></script>
  <script>
    const STOCK_DATA = window.STOCK_DATA || { updated_at: "데이터 없음 (run_pipeline.bat 먼저 실행)", results: {} };
    // 종목 파인더 데이터(discover.py 산출물) — REJECT(버핏 기준 미달)는 검색 대상에서 제외
    const CANDIDATES_DATA = window.CANDIDATES_DATA || { generated_at: "데이터 없음 (discover.py 먼저 실행)", candidates: [] };
    const SEARCHABLE_CANDIDATES = CANDIDATES_DATA.candidates.filter((c) => c.warren_score?.verdict !== "REJECT");
    const HOLDINGS_KEY = "stock_app_holdings";

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // 종목명 ↔ 티커 매핑 (파이프라인이 분석한 국내 종목만 대상, run_pipeline.py가 채운 name 필드 기반)
    const nameToTicker = {};
    for (const [ticker, r] of Object.entries(STOCK_DATA.results)) {
      if (r && r.name) nameToTicker[r.name] = ticker;
    }

    function resolveTicker(input) {
      return nameToTicker[input] || input;
    }

    // 종목명으로 못 찾았는데 입력값도 티커 형식이 아니면(한글 등) 조용히 저장하지 않고
    // 걸러낸다 — 예전엔 "알파벳A" 같은 텍스트가 그대로 티커로 저장되어 이후 조회가 전부
    // 조용히 실패했음(빈 칸만 뜸).
    function looksLikeTicker(s) {
      return /^\d{6}$/.test(s) || /^[A-Za-z.]{1,6}$/.test(s);
    }

    function populateTickerSuggestions() {
      const list = document.getElementById("tickerSuggestions");
      list.innerHTML = "";
      for (const [ticker, r] of Object.entries(STOCK_DATA.results)) {
        const opt1 = document.createElement("option");
        opt1.value = ticker;
        opt1.label = r.name ? `${r.name}` : ticker;
        list.appendChild(opt1);
        if (r.name) {
          const opt2 = document.createElement("option");
          opt2.value = r.name;
          opt2.label = ticker;
          list.appendChild(opt2);
        }
      }
    }

    // 참고용 매매 레벨 — 현재가 대비 고정 비율. 투자 조언이 아닌 대략적인 기준선.
    function priceLevels(price) {
      const round2 = (v) => Math.round(v * 100) / 100;
      return {
        buyLow: round2(price * 0.98),
        buyHigh: round2(price),
        stopLoss: round2(price * 0.92),
        target: round2(price * 1.15),
      };
    }

    // 국내/해외 종목 가격을 원화로 통일 표시. 해외는 usdKrwRate로 환산 —
    // server.py의 /fx(실시간)가 있으면 그 값을, 없으면(정적 배포 등) 아래 기본값을 쓴다.
    // 참고용 환산이며 투자/환전 조언이 아니다.
    let usdKrwRate = 1400;

    async function loadUsdKrwRate() {
      try {
        const res = await Promise.race([
          fetch("http://127.0.0.1:8765/fx"),
          new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 1000)),
        ]);
        const json = await res.json();
        if (json.status === "ok" && json.rate) usdKrwRate = json.rate;
      } catch (e) {
        // 로컬 서버 없음/느림 — 기본 환율 그대로 사용
      }
    }

    function toKrw(market, price) {
      return market === "kr" ? price : price * usdKrwRate;
    }
    function formatPrice(market, price) {
      if (price == null) return "—";
      return "₩" + Math.round(toKrw(market, price)).toLocaleString("ko-KR");
    }

    // ── 종목 파인더(버핏 검토) 전용 헬퍼 — candidates.js의 warren_score(0~10)/buffett_review 사용
    function gradeLabel(score) {
      if (score == null) return "—";
      if (score >= 7) return "우수";
      if (score >= 5) return "양호";
      if (score >= 3) return "보통";
      return "미흡";
    }

    function finderTechGrade(score, rsi) {
      if (score == null) return "—";
      let label = score >= 7 ? "강세" : score >= 5 ? "중립" : "약세";
      if (rsi != null) {
        if (rsi >= 70) label += "(과열)";
        else if (rsi <= 35) label += "(저점)";
      }
      return label;
    }

    function verdictBadge(c) {
      const ws = c.warren_score;
      const verdict = ws?.verdict;
      if (verdict === "WAIT") return { cls: "verdict-wait", text: "관망" };
      if (verdict === "REJECT") return { cls: "verdict-reject", text: "제외" };
      if (c.opinion === "매도") return { cls: "opinion-sell", text: "매도" };
      if (c.opinion === "보유") return { cls: "opinion-hold", text: "보유" };
      const hint = ws && ws.timing != null && ws.timing < 6 ? " (분할매수)" : "";
      return { cls: "verdict-pass", text: "매수" + hint };
    }

    // 해외(US) 종목 실시간 조회: tickers.json에 아직 없는 신규 티커를 보유종목에 추가했을
    // 때 쓴다. 브라우저가 Yahoo Finance를 직접 fetch하면 origin 불문 CORS로 막히므로
    // (실측 확인됨), 로컬 서버(server.py의 /quote, run_pipeline.analyze_ticker 재사용)를
    // 경유한다 — run_pipeline.bat이 켜져 있을 때만 동작한다.
    async function fetchLiveUsAnalysis(ticker) {
      let json;
      try {
        const res = await fetch(`http://127.0.0.1:8765/quote?ticker=${encodeURIComponent(ticker)}`);
        json = await res.json();
      } catch (e) {
        throw new Error("로컬 서버에 연결할 수 없음 — run_pipeline.bat을 먼저 실행해 두세요");
      }
      if (json.status !== "ok") throw new Error(json.message || "실시간 조회 실패");
      return json.result;
    }

    const liveCache = {};
    const liveLoading = new Set();

    function getAnalysis(ticker) {
      if (liveCache[ticker]) return liveCache[ticker];
      return STOCK_DATA.results[ticker];
    }

    function ensureLiveAnalysis(ticker, market) {
      if (market !== "us") return; // KR은 브라우저에서 직접 조회할 공개 API가 없음
      if (liveCache[ticker] || liveLoading.has(ticker)) return;
      liveLoading.add(ticker);
      fetchLiveUsAnalysis(ticker)
        .then((result) => { liveCache[ticker] = result; })
        .catch((e) => { liveCache[ticker] = { market: "us", error: e.message }; })
        .finally(() => { liveLoading.delete(ticker); renderHoldingsTab(); });
    }

    function loadHoldings() {
      try {
        return JSON.parse(localStorage.getItem(HOLDINGS_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveHoldings(holdings) {
      localStorage.setItem(HOLDINGS_KEY, JSON.stringify(holdings));
    }

    // ── 포트폴리오 요약 카드 + 수익률 추이 ──
    const CASH_KEY = "stock_app_cash";
    function loadCash() {
      const v = parseFloat(localStorage.getItem(CASH_KEY));
      return isNaN(v) ? 0 : v;
    }
    function saveCash(v) {
      localStorage.setItem(CASH_KEY, String(v));
    }

    // 매도/부분매도로 확정된 손익 기록 — 종합 수익률·그래프가 이 값을 계속 반영해야
    // "팔아서 이익 확정한 걸 그래프에서 잃어버리는" 일이 없다.
    const REALIZED_KEY = "stock_app_realized";
    function loadRealized() {
      try {
        return JSON.parse(localStorage.getItem(REALIZED_KEY)) || [];
      } catch (e) {
        return [];
      }
    }
    function recordRealizedSale(ticker, quantity, buyPriceKrw, sellPriceKrw) {
      const list = loadRealized();
      list.push({
        date: dateKey(today.getFullYear(), today.getMonth(), today.getDate()),
        ticker, quantity, buyPriceKrw, sellPriceKrw,
        realizedPnl: (sellPriceKrw - buyPriceKrw) * quantity,
      });
      localStorage.setItem(REALIZED_KEY, JSON.stringify(list));
    }

    // 이 앱엔 포트폴리오 총자산의 과거 이력이 없었다 — 여기서부터 방문할 때마다
    // 오늘 날짜로 수익률 스냅샷을 남겨 실제 추이를 쌓아간다(가짜 과거 데이터는 안 만듦).
    const PORTFOLIO_HISTORY_KEY = "stock_app_portfolio_history";
    function loadPortfolioHistory() {
      try {
        return JSON.parse(localStorage.getItem(PORTFOLIO_HISTORY_KEY)) || [];
      } catch (e) {
        return [];
      }
    }
    function recordPortfolioSnapshot(returnPct) {
      const history = loadPortfolioHistory();
      const todayStr = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
      const idx = history.findIndex((p) => p.date === todayStr);
      const point = { date: todayStr, returnPct };
      if (idx >= 0) history[idx] = point; else history.push(point);
      localStorage.setItem(PORTFOLIO_HISTORY_KEY, JSON.stringify(history));
      return history;
    }

    function renderPortfolioChart(history) {
      const box = document.getElementById("portfolioChart");
      if (history.length < 2) {
        box.innerHTML = `
          <div class="chart-box-title">수익률 추이</div>
          <div class="chart-empty">오늘부터 기록을 시작했어요${history.length ? ` (오늘 수익률 ${history[0].returnPct.toFixed(2)}%)` : ""}. 매일 방문하면 여기에 추이가 쌓입니다.</div>`;
        return;
      }
      const w = 640, h = 120, pad = 12;
      const returns = history.map((p) => p.returnPct);
      const minR = Math.min(...returns, 0);
      const maxR = Math.max(...returns, 0);
      const range = maxR - minR || 1;
      const stepX = (w - pad * 2) / (returns.length - 1);
      const pts = returns
        .map((r, i) => `${(pad + i * stepX).toFixed(1)},${(pad + (1 - (r - minR) / range) * (h - pad * 2)).toFixed(1)}`)
        .join(" ");
      const last = returns[returns.length - 1];
      const color = last >= 0 ? "var(--buy)" : "var(--sell)";
      box.innerHTML = `
        <div class="chart-box-title">수익률 추이 (${history[0].date} ~ ${history[history.length - 1].date})</div>
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:120px;display:block" preserveAspectRatio="none">
          <polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="2" />
        </svg>
        <div style="font-size:12px;color:var(--text-muted)">최근 수익률 ${last.toFixed(2)}%</div>`;
    }

    function renderPortfolioSummary() {
      const holdings = loadHoldings();
      let totalInvested = 0;
      let totalStockValue = 0;
      holdings.forEach((h) => {
        const r = getAnalysis(h.ticker);
        totalInvested += toKrw(h.market, h.buyPrice) * h.quantity;
        if (r && !r.error) totalStockValue += toKrw(h.market, r.price) * h.quantity;
      });
      const realized = loadRealized();
      const totalRealizedPnl = realized.reduce((s, e) => s + e.realizedPnl, 0);
      const totalRealizedCost = realized.reduce((s, e) => s + e.buyPriceKrw * e.quantity, 0);
      const totalInvestedEver = totalInvested + totalRealizedCost;

      const cash = loadCash();
      const totalAssets = totalStockValue + cash;
      const totalReturn = totalInvestedEver > 0
        ? ((totalStockValue - totalInvested + totalRealizedPnl) / totalInvestedEver) * 100
        : 0;
      const returnCls = totalReturn >= 0 ? "pnl-plus" : "pnl-minus";

      document.getElementById("portfolioSummary").innerHTML = `
        <div class="summary-card">
          <div class="summary-card-label">💼 총 투자금액</div>
          <div class="summary-card-value">${formatPrice("kr", totalInvested)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-card-label">💵 현금 보유액</div>
          <input type="number" class="summary-card-cash-input" id="cashInput" value="${cash || ""}" placeholder="0 (직접 입력)" />
        </div>
        <div class="summary-card">
          <div class="summary-card-label">📊 현재 총자산</div>
          <div class="summary-card-value">${formatPrice("kr", totalAssets)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-card-label">📈 종합 수익률</div>
          <div class="summary-card-value ${returnCls}">${totalReturn >= 0 ? "+" : ""}${totalReturn.toFixed(2)}%</div>
        </div>
        <div class="summary-card">
          <div class="summary-card-label">🎯 실현손익</div>
          <div class="summary-card-value ${totalRealizedPnl >= 0 ? "pnl-plus" : "pnl-minus"}">${formatPrice("kr", totalRealizedPnl)}</div>
        </div>`;

      document.getElementById("cashInput").addEventListener("change", (e) => {
        saveCash(parseFloat(e.target.value) || 0);
        renderPortfolioSummary();
      });

      renderPortfolioChart(recordPortfolioSnapshot(totalReturn));
    }

    function opinionClass(opinion) {
      if (opinion === "매수" || opinion === "익절의견") return "opinion-buy";
      if (opinion === "매도" || opinion === "매도의견") return "opinion-sell";
      return "opinion-hold";
    }

    // 보유종목 전용: 매입가 기준 손절가/목표가에 현재가가 닿았는지 확인해 기술적 의견보다
    // 우선 표시한다(리스크 관리 신호가 RSI 등 기술적 판정보다 더 급함).
    function positionSignal(currentPrice, lv, fallbackOpinion) {
      if (currentPrice <= lv.stopLoss) return "매도의견";
      if (currentPrice >= lv.target) return "익절의견";
      return fallbackOpinion;
    }

    function renderUpdatedAt() {
      document.getElementById("updatedAt").textContent =
        "마지막 업데이트: " + STOCK_DATA.updated_at;
    }

    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
    const today = new Date();

    function pad2(n) { return String(n).padStart(2, "0"); }
    function dateKey(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }

    // 버핏 검토 상세 모달 — 종목 파인더 카드의 "AI 분석 보기"가 사용.
    function openBuffettModal(candidate) {
      document.getElementById("buffettModalTitle").textContent = `${candidate.name} (${candidate.ticker})`;
      const review = candidate.buffett_review;
      const body = document.getElementById("buffettModalBody");
      if (!review) {
        body.innerHTML = '<p class="empty-msg">아직 버핏 검토가 준비되지 않았습니다.</p>';
      } else {
        const buyReasons = (review.stage4?.buy_reasons || [])
          .map((r) => `<li>${escapeHtml(r)}</li>`).join("");
        const riskReasons = (review.stage4?.risk_reasons || [])
          .map((r) => `<li>${escapeHtml(r)}</li>`).join("");
        body.innerHTML = `
          <div class="buffett-conclusion">${escapeHtml(review.stage3_conclusion || "")}</div>
          ${buyReasons ? `<div class="buffett-section"><div class="buffett-section-title">투자 포인트</div><ul class="buffett-list">${buyReasons}</ul></div>` : ""}
          ${riskReasons ? `<div class="buffett-section"><div class="buffett-section-title">리스크 요인</div><ul class="buffett-list">${riskReasons}</ul></div>` : ""}
          ${review.valuation ? `<div class="buffett-section"><div class="buffett-section-title">밸류에이션</div><p>${escapeHtml(review.valuation)}</p></div>` : ""}
          ${review.stage4?.beginner_advice ? `<div class="buffett-section"><div class="buffett-section-title">초보자 조언</div><p>${escapeHtml(review.stage4.beginner_advice)}</p></div>` : ""}
          ${review.stage4?.summary ? `<div class="buffett-section" style="color:#999;font-style:italic">${escapeHtml(review.stage4.summary)}</div>` : ""}
        `;
      }
      document.getElementById("buffettModal").classList.add("active");
    }
    document.getElementById("buffettModalCloseBtn").addEventListener("click", () => {
      document.getElementById("buffettModal").classList.remove("active");
    });
    document.getElementById("buffettModal").addEventListener("click", (e) => {
      if (e.target.id === "buffettModal") document.getElementById("buffettModal").classList.remove("active");
    });

    // ── 초보자용 "왜 이 의견인가요?" 설명 팝업 (보유종목 의견 배지 클릭 시) ──
    function beginnerRSI(rsi) {
      if (rsi < 30) return `RSI ${rsi} — 30 밑이면 "과매도"예요. 많이 떨어져서 반등 가능성이 있는 구간이라는 뜻이에요.`;
      if (rsi > 70) return `RSI ${rsi} — 70 위면 "과매수"예요. 많이 올라서 조정(하락)이 나올 수 있는 구간이라는 뜻이에요.`;
      return `RSI ${rsi} — 30~70 사이라 "중립"이에요. 딱히 많이 오르지도 떨어지지도 않은 상태예요.`;
    }
    function beginnerMA(ma5, ma20) {
      if (ma5 > ma20) return `5일 평균가(${ma5})가 20일 평균가(${ma20})보다 높아요 — "골든크로스", 단기 상승 흐름 신호예요.`;
      return `5일 평균가(${ma5})가 20일 평균가(${ma20})보다 낮아요 — "데드크로스", 단기 하락 흐름 신호예요.`;
    }
    function beginnerMACD(macd, signal) {
      if (macd > signal) return `MACD선(${macd})이 시그널선(${signal})보다 위예요 — 상승 쪽으로 전환되는 신호예요.`;
      return `MACD선(${macd})이 시그널선(${signal})보다 아래예요 — 하락 쪽으로 전환되는 신호예요.`;
    }

    function openOpinionModal(name, ticker, h, r, lv, displayOpinion) {
      document.getElementById("opinionModalTitle").textContent = `${name} (${ticker}) — 의견 설명`;
      const overridden = displayOpinion !== r.opinion;
      let html = `<div class="buffett-conclusion">${displayOpinion}</div>`;

      if (overridden) {
        const isStop = displayOpinion === "매도의견";
        html += `
          <div class="buffett-section">
            <div class="buffett-section-title">왜 ${displayOpinion}인가요?</div>
            <p style="font-size:13px;color:var(--text-muted);line-height:1.5">
              매입가 ${formatPrice(h.market, h.buyPrice)}에 사셨는데 현재가 ${formatPrice(h.market, r.price)}는
              ${isStop
                ? `손절 기준선 ${formatPrice(h.market, lv.stopLoss)}(매입가 대비 -8%)보다 낮아요.`
                : `목표가 ${formatPrice(h.market, lv.target)}(매입가 대비 +15%)보다 높아요.`}
              아래 기술적 지표와 무관하게, <b>미리 정해둔 리스크 관리 기준에 닿았다는 뜻</b>이라 이 신호를 우선 보여드려요.
            </p>
          </div>`;
      }

      html += `
        <div class="buffett-section">
          <div class="buffett-section-title">기술적 지표는 어떤가요? (참고용)</div>
          <ul class="buffett-list">
            <li>${beginnerRSI(r.rsi)}</li>
            <li>${beginnerMA(r.ma5, r.ma20)}</li>
            <li>${beginnerMACD(r.macd, r.macd_signal)}</li>
          </ul>
          <p style="font-size:13px;color:var(--text-muted);margin-top:10px;line-height:1.5">
            이 3개 신호를 하나씩 점수로 매겨(좋으면 +1점, 나쁘면 -1점) 합산한 게 <b>${r.score}점</b>이고,
            <b>+2점 이상이면 매수, -2점 이하면 매도, 그 사이면 보유</b>로 판정해요. 지금 기술적 판정은 "${r.opinion}"이에요.
          </p>
        </div>`;

      document.getElementById("opinionModalBody").innerHTML = html;
      document.getElementById("opinionModal").classList.add("active");
    }
    document.getElementById("opinionModalCloseBtn").addEventListener("click", () => {
      document.getElementById("opinionModal").classList.remove("active");
    });
    document.getElementById("opinionModal").addEventListener("click", (e) => {
      if (e.target.id === "opinionModal") document.getElementById("opinionModal").classList.remove("active");
    });

    function renderHoldingsTab() {
      renderPortfolioSummary();
      const tbody = document.querySelector("#holdingsTable tbody");
      tbody.innerHTML = "";
      const holdings = loadHoldings();

      if (holdings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="13" class="empty-msg">등록된 보유종목이 없습니다.</td></tr>';
        return;
      }

      holdings.forEach((h, idx) => {
        const r = getAnalysis(h.ticker);
        const tr = document.createElement("tr");
        const name = (r && r.name) || "-";

        const actionBtns = `<button class="edit-btn" data-idx="${idx}">수정</button>
            <button class="del-btn" data-idx="${idx}">삭제</button>`;

        const buyPriceKrw = formatPrice(h.market, h.buyPrice);

        if (!r || r.error) {
          if (liveLoading.has(h.ticker)) {
            tr.innerHTML = `
              <td>${h.ticker}</td><td>${name}</td><td>${buyPriceKrw}</td><td>${h.quantity.toLocaleString("ko-KR")}</td>
              <td colspan="8" class="no-data">실시간 시세 조회 중...</td>
              <td>${actionBtns}</td>`;
          } else if (h.market === "us") {
            const reason = r ? r.error : "실시간 조회 대기 중";
            tr.innerHTML = `
              <td>${h.ticker}</td><td>${name}</td><td>${buyPriceKrw}</td><td>${h.quantity.toLocaleString("ko-KR")}</td>
              <td colspan="8" class="no-data">지표 없음 — ${reason}</td>
              <td>${actionBtns}</td>`;
            ensureLiveAnalysis(h.ticker, h.market);
          } else {
            const reason = r ? r.error : "tickers.json에 등록되지 않음";
            tr.innerHTML = `
              <td>${h.ticker}</td><td>${name}</td><td>${buyPriceKrw}</td><td>${h.quantity.toLocaleString("ko-KR")}</td>
              <td colspan="8" class="no-data">지표 없음 — ${reason}. tickers.json에 추가 후 재실행 필요</td>
              <td>${actionBtns}</td>`;
          }
        } else {
          const pnl = (r.price - h.buyPrice) * h.quantity;
          const pnlPct = ((r.price - h.buyPrice) / h.buyPrice) * 100;
          const pnlClass = pnl >= 0 ? "pnl-plus" : "pnl-minus";
          // 매입가 기준(진입가 대비 고정) — 현재가 기준이면 손절가/목표가가 늘 현재가에서
          // 같은 비율만큼 떨어져 있어 "근처에 왔는지" 판단이 성립하지 않는다.
          const lv = priceLevels(h.buyPrice);
          const displayOpinion = positionSignal(r.price, lv, r.opinion);
          // 배지(손절/익절 신호)와 코멘트(기술적 지표)가 서로 다른 얘기를 할 수 있으므로
          // — 예: 손절선은 넘었는데 RSI/MACD는 여전히 매수 우위 — 둘 다 보여준다.
          // 손절/익절은 매입가 기준 사실(risk-management)이라 기술적 지표보다 우선한다.
          const commentText = displayOpinion !== r.opinion
            ? `매입가 대비 ${displayOpinion === "매도의견" ? "손절선(-8%) 도달" : "목표가(+15%) 도달"} · 기술적 지표는 참고: ${r.comment}`
            : r.comment;
          tr.innerHTML = `
            <td>${h.ticker}</td><td>${name}</td><td>${buyPriceKrw}</td><td>${h.quantity.toLocaleString("ko-KR")}</td><td>${formatPrice(h.market, r.price)}</td>
            <td class="${pnlClass}">${formatPrice(h.market, pnl)}</td>
            <td class="${pnlClass}">${pnlPct.toFixed(2)}%</td>
            <td><span class="opinion ${opinionClass(displayOpinion)}" title="매입가 대비 손절/목표가 도달 여부가 RSI·이평선·MACD 기술적 판정보다 우선 표시됩니다">${displayOpinion}</span></td>
            <td title="매입가 대비 -2%~0% 구간 - 참고용, 투자 조언 아님">${formatPrice(h.market, lv.buyLow)} ~ ${formatPrice(h.market, lv.buyHigh)}</td>
            <td title="매입가 대비 -8% - 현재가가 이 아래로 오면 '매도의견'으로 표시됨">${formatPrice(h.market, lv.stopLoss)}</td>
            <td title="매입가 대비 +15% - 현재가가 이 위로 오면 '익절의견'으로 표시됨">${formatPrice(h.market, lv.target)}</td>
            <td style="text-align:left">${commentText}</td>
            <td>${actionBtns}</td>`;
          tr.querySelector(".opinion").addEventListener("click", () => {
            openOpinionModal(name, h.ticker, h, r, lv, displayOpinion);
          });
        }
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll(".del-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const holdings = loadHoldings();
          holdings.splice(Number(btn.dataset.idx), 1);
          saveHoldings(holdings);
          if (editingIndex === Number(btn.dataset.idx)) exitEditMode();
          renderHoldingsTab();
        });
      });

      tbody.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.idx);
          const holdings = loadHoldings();
          const h = holdings[idx];
          document.getElementById("hTicker").value = h.ticker;
          document.getElementById("hMarket").value = h.market;
          // 저장값은 시장 원래 통화(해외=달러) 그대로라, 입력창엔 원화로 환산해서 보여준다.
          document.getElementById("hBuyPrice").value = Math.round(toKrw(h.market, h.buyPrice));
          document.getElementById("hQuantity").value = h.quantity;
          editingIndex = idx;
          document.getElementById("hAddBtn").textContent = "수정 완료";
          document.getElementById("hCancelBtn").style.display = "";
        });
      });
    }

    // ── 종목 파인더 탭 ── 캘린더(아래 renderFinderCalendar)에서 날짜를 더블클릭하면
    // 이 필터+랭킹 카드 그리드가 모달로 열린다.
    let finderMarket = "all";
    let finderOpinionFilter = "all";
    const finderTags = new Set();
    let finderSearchTerm = "";

    // candidates.json은 discover.py를 수동 실행할 때마다의 스냅샷 하나뿐이라(진짜 날짜별
    // 이력이 없음) 캘린더에서도 generated_at 날짜 한 칸만 클릭 가능하다. pad2/dateKey/today는
    // 관심종목 현황 캘린더(위쪽)에서 이미 정의된 걸 그대로 재사용한다.
    const finderDateStr = CANDIDATES_DATA.generated_at.split(" ")[0];
    const finderDateParsed = /^\d{4}-\d{2}-\d{2}$/.test(finderDateStr)
      ? finderDateStr.split("-").map(Number)
      : null;
    let finderCalYear = finderDateParsed ? finderDateParsed[0] : today.getFullYear();
    let finderCalMonth = finderDateParsed ? finderDateParsed[1] - 1 : today.getMonth();

    function renderFinderCalendar() {
      document.getElementById("finderCalMonthLabel").textContent = `${finderCalYear}년 ${finderCalMonth + 1}월`;
      const grid = document.getElementById("finderCalGrid");
      grid.innerHTML = "";

      WEEKDAYS.forEach((w) => {
        const cell = document.createElement("div");
        cell.className = "cal-weekday";
        cell.textContent = w;
        grid.appendChild(cell);
      });

      const firstDow = new Date(finderCalYear, finderCalMonth, 1).getDay();
      const daysInMonth = new Date(finderCalYear, finderCalMonth + 1, 0).getDate();
      const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
      const isDataDay = (d) =>
        finderDateParsed &&
        finderDateParsed[0] === finderCalYear &&
        finderDateParsed[1] - 1 === finderCalMonth &&
        finderDateParsed[2] === d;

      for (let i = 0; i < firstDow; i++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell empty";
        grid.appendChild(cell);
      }

      const passCount = SEARCHABLE_CANDIDATES.filter((c) => c.warren_score?.verdict === "PASS").length;
      const waitCount = SEARCHABLE_CANDIDATES.filter((c) => c.warren_score?.verdict === "WAIT").length;

      for (let d = 1; d <= daysInMonth; d++) {
        const key = dateKey(finderCalYear, finderCalMonth, d);
        const hasData = isDataDay(d);
        const cell = document.createElement("div");
        cell.className = "cal-cell" + (hasData ? " has-data" : "") + (key === todayKey ? " today" : "");
        const itemHtml = hasData
          ? `<div class="cal-item">매수의견 ${passCount}건,관망 ${waitCount}건</div>`
          : "";
        cell.innerHTML = `<div class="cal-date">${d}</div>${itemHtml}`;
        if (hasData) cell.addEventListener("dblclick", openFinderModal);
        grid.appendChild(cell);
      }
    }

    function openFinderModal() {
      document.getElementById("finderModalDate").textContent = finderDateStr;
      renderFinderCards();
      document.getElementById("finderModal").classList.add("active");
    }
    document.getElementById("finderCalPrevBtn").addEventListener("click", () => {
      finderCalMonth -= 1;
      if (finderCalMonth < 0) { finderCalMonth = 11; finderCalYear -= 1; }
      renderFinderCalendar();
    });
    document.getElementById("finderCalNextBtn").addEventListener("click", () => {
      finderCalMonth += 1;
      if (finderCalMonth > 11) { finderCalMonth = 0; finderCalYear += 1; }
      renderFinderCalendar();
    });
    document.getElementById("finderModalCloseBtn").addEventListener("click", () => {
      document.getElementById("finderModal").classList.remove("active");
    });
    document.getElementById("finderModal").addEventListener("click", (e) => {
      if (e.target.id === "finderModal") document.getElementById("finderModal").classList.remove("active");
    });

    function renderFinderCards() {
      const grid = document.getElementById("finderCards");
      grid.innerHTML = "";

      const filtered = SEARCHABLE_CANDIDATES
        .filter((c) => {
          if (finderMarket !== "all" && c.market !== finderMarket) return false;
          if (finderOpinionFilter !== "all" && c.opinion !== finderOpinionFilter) return false;
          if (finderTags.size > 0 && !(c.tags || []).some((t) => finderTags.has(t))) return false;
          if (finderSearchTerm && !(c.name.includes(finderSearchTerm) || c.ticker.includes(finderSearchTerm))) return false;
          return true;
        })
        .sort((a, b) => (b.warren_score?.total ?? -1) - (a.warren_score?.total ?? -1));

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty-msg">조건에 맞는 종목이 없습니다.</p>';
        return;
      }

      filtered.forEach((c, i) => {
        const ws = c.warren_score;
        const badge = verdictBadge(c);
        const summary = c.buffett_review?.stage4?.summary || c.buffett_review?.stage3_conclusion || c.comment;
        const financeDetail = c.buffett_review?.checklist?.moat || c.buffett_review?.valuation || "";
        const lv = priceLevels(c.price);

        const card = document.createElement("div");
        card.className = "stock-card";
        card.innerHTML = `
          <div class="stock-card-header">
            <div>
              <div class="stock-card-title">${i + 1}. ${escapeHtml(c.name)} <span class="ticker">(${c.ticker})</span></div>
              <div class="stock-card-sub">
                ${c.market === "kr" ? "국내" : "해외"} · ${formatPrice(c.market, c.price)}
                ${ws && ws.total != null ? ` · 총점 ${ws.total.toFixed(1)}` : ""}
              </div>
            </div>
            <span class="stock-card-badge ${badge.cls}">${badge.text}</span>
          </div>
          <p class="stock-card-summary">${escapeHtml(summary || "")}</p>
          <div class="stock-card-cols">
            <div>
              <div class="stock-card-detail-title">재무 평가 [${gradeLabel(ws?.financial)}]</div>
              <div class="stock-card-detail-body">${escapeHtml(financeDetail)}</div>
            </div>
            <div>
              <div class="stock-card-detail-title">기술 평가 [${finderTechGrade(ws?.technical, ws?.rsi)}]</div>
              <div class="stock-card-detail-body">${escapeHtml(c.comment || "")}</div>
            </div>
          </div>
          <div class="stock-card-levels">
            <div><div class="label">매수</div><div class="value">${formatPrice(c.market, lv.buyLow)} ~ ${formatPrice(c.market, lv.buyHigh)}</div></div>
            <div><div class="label">손절</div><div class="value">${formatPrice(c.market, lv.stopLoss)}</div></div>
            <div><div class="label">목표</div><div class="value">${formatPrice(c.market, lv.target)}</div></div>
          </div>
          <button class="stock-card-add-btn add-to-watch-btn">관심종목에 추가</button>
          <a href="#" class="stock-card-link buffett-link">AI 분석 보기 →</a>
        `;
        card.querySelector(".buffett-link").addEventListener("click", (e) => {
          e.preventDefault();
          openBuffettModal(c);
        });
        card.querySelector(".add-to-watch-btn").addEventListener("click", () => {
          document.querySelector('.tab-btn[data-tab="holdings"]').click();
          document.getElementById("hTicker").value = c.ticker;
          document.getElementById("hMarket").value = c.market;
          document.getElementById("hBuyPrice").value = Math.round(toKrw(c.market, c.price));
          document.getElementById("hQuantity").value = "";
          document.getElementById("hQuantity").focus();
        });
        grid.appendChild(card);
      });
    }

    document.getElementById("finderMarketSeg").addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") return;
      finderMarket = e.target.dataset.value;
      document.querySelectorAll("#finderMarketSeg button").forEach((b) => b.classList.toggle("active", b === e.target));
      renderFinderCards();
    });
    document.getElementById("finderOpinionSeg").addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") return;
      finderOpinionFilter = e.target.dataset.value;
      document.querySelectorAll("#finderOpinionSeg button").forEach((b) => b.classList.toggle("active", b === e.target));
      renderFinderCards();
    });
    document.querySelectorAll(".finder-filters .tag-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const tag = btn.dataset.tag;
        if (finderTags.has(tag)) finderTags.delete(tag);
        else finderTags.add(tag);
        btn.classList.toggle("active");
        renderFinderCards();
      });
    });
    document.getElementById("finderSearch").addEventListener("input", (e) => {
      finderSearchTerm = e.target.value.trim();
      renderFinderCards();
    });

    let editingIndex = null;

    function exitEditMode() {
      editingIndex = null;
      document.getElementById("hAddBtn").textContent = "추가";
      document.getElementById("hCancelBtn").style.display = "none";
      document.getElementById("hTicker").value = "";
      document.getElementById("hBuyPrice").value = "";
      document.getElementById("hQuantity").value = "";
    }


    document.getElementById("hAddBtn").addEventListener("click", () => {
      const rawInput = document.getElementById("hTicker").value.trim();
      const ticker = resolveTicker(rawInput);
      const market = document.getElementById("hMarket").value;
      const buyPriceKrwInput = parseFloat(document.getElementById("hBuyPrice").value);
      const quantity = parseFloat(document.getElementById("hQuantity").value);

      if (!ticker || isNaN(buyPriceKrwInput) || isNaN(quantity)) {
        alert("티커, 매입가, 수량을 모두 입력하세요.");
        return;
      }
      const resolvedByName = ticker !== rawInput;
      if (!resolvedByName && !looksLikeTicker(ticker)) {
        alert(`"${rawInput}"을(를) 종목으로 인식할 수 없습니다. 정확한 티커(예: 005930, AAPL)를 입력하거나 목록에서 종목명을 선택하세요.`);
        return;
      }
      // 입력창은 항상 원화 기준 — 저장은 기존처럼 시장 원래 통화(해외=달러)로 되돌려서
      // 넣는다. 다른 계산(평가손익 등)이 전부 "저장값=원래 통화"를 전제로 하고 있어서다.
      const buyPrice = market === "us" ? buyPriceKrwInput / usdKrwRate : buyPriceKrwInput;

      const holdings = loadHoldings();

      // 수정 저장 시 수량이 줄어들면 그 차이를 매도(부분매도 포함)로 처리한다 —
      // 매도가는 현재가를 기본값으로 쓴다(별도 매도가 입력창을 만드는 대신 가벼운 방식 선택).
      // 실현손익은 현금에 더해지고, 종합 수익률·그래프에 영구 반영된다.
      if (editingIndex !== null) {
        const old = holdings[editingIndex];
        const soldQty = old.quantity - quantity;
        let keepOldBuyPrice = false;
        if (soldQty > 0) {
          keepOldBuyPrice = true; // 매도로 처리되는 경우 남은 수량의 평균 매입단가는 그대로 유지
          const r = getAnalysis(old.ticker);
          const sellPriceKrw = r && !r.error ? toKrw(old.market, r.price) : toKrw(old.market, old.buyPrice);
          const buyPriceKrw = toKrw(old.market, old.buyPrice);
          recordRealizedSale(old.ticker, soldQty, buyPriceKrw, sellPriceKrw);
          saveCash(loadCash() + sellPriceKrw * soldQty);
          const pnl = (sellPriceKrw - buyPriceKrw) * soldQty;
          alert(
            `${old.ticker} ${soldQty.toLocaleString("ko-KR")}주를 ${formatPrice("kr", sellPriceKrw)}에 매도 처리했습니다.\n` +
            `실현손익 ${formatPrice("kr", pnl)} — 현금 잔고에 반영됐습니다.` +
            (r && !r.error ? "" : "\n(현재가를 못 가져와 매입가로 대체 계산했습니다.)")
          );
        }
        const addedQty = quantity - old.quantity;
        if (quantity <= 0) {
          holdings.splice(editingIndex, 1);
        } else if (keepOldBuyPrice) {
          holdings[editingIndex] = { ticker, market, buyPrice: old.buyPrice, quantity };
        } else if (addedQty > 0) {
          // 추가매수: 입력한 "매입가"를 새로 사는 몫의 단가로 보고 기존 수량과 가중평균한다.
          // 매도가 현금을 늘리는 것과 대칭으로, 추가매수는 그만큼 현금에서 차감한다.
          const oldBuyPriceKrw = toKrw(old.market, old.buyPrice);
          const newAvgKrw = (oldBuyPriceKrw * old.quantity + buyPriceKrwInput * addedQty) / quantity;
          const newAvgNative = market === "us" ? newAvgKrw / usdKrwRate : newAvgKrw;
          holdings[editingIndex] = { ticker, market, buyPrice: newAvgNative, quantity };
          saveCash(loadCash() - buyPriceKrwInput * addedQty);
          alert(
            `${addedQty.toLocaleString("ko-KR")}주를 ${formatPrice("kr", buyPriceKrwInput)}에 추가매수 처리했습니다.\n` +
            `평균 매입단가가 ${formatPrice("kr", newAvgKrw)}(으)로 재계산됐고, 매수금액은 현금 잔고에서 차감됐습니다.`
          );
        } else {
          holdings[editingIndex] = { ticker, market, buyPrice, quantity };
        }
      } else {
        holdings.push({ ticker, market, buyPrice, quantity });
        saveCash(loadCash() - buyPriceKrwInput * quantity);
      }
      saveHoldings(holdings);
      exitEditMode();
      renderHoldingsTab();
    });

    document.getElementById("hCancelBtn").addEventListener("click", () => {
      exitEditMode();
    });

    // run_pipeline.bat이 띄워둔 로컬 서버(server.py, 127.0.0.1:8765)의 /run을 호출해
    // 파이프라인을 재실행시킨다. 서버가 안 떠 있으면(=run_pipeline.bat 미실행) fetch가
    // 실패하므로 그 경우를 안내 메시지로 구분해서 보여준다.
    document.getElementById("updateBtn").addEventListener("click", async () => {
      const btn = document.getElementById("updateBtn");
      const status = document.getElementById("updateStatus");
      btn.disabled = true;
      status.textContent = "업데이트 중... (몇 초 걸릴 수 있습니다)";
      try {
        const res = await fetch("http://127.0.0.1:8765/run");
        const json = await res.json();
        if (json.status === "ok") {
          location.reload();
          return;
        }
        status.textContent = "업데이트 실패: " + json.message;
      } catch (e) {
        status.textContent = "서버에 연결할 수 없습니다 — run_pipeline.bat을 먼저 실행해 두세요.";
      }
      btn.disabled = false;
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      });
    });

    renderUpdatedAt();
    populateTickerSuggestions();
    renderFinderCalendar();
    loadUsdKrwRate().then(renderHoldingsTab);
  </script>
</body>
</html>
